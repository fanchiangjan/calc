<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跟單投資計算機</title>
    <style>
        :root { --primary: #00d2ff; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --accent: #f39c12; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .container { width: 100%; max-width: 500px; margin: auto; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 1.4rem; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 20px; border-left: 5px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .step2 { border-left-color: var(--accent); }
        .step3 { border-left-color: #4caf50; }
        .card-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; display: block; }
        .fee-info { font-size: 0.8rem; color: #888; margin-bottom: 10px; display: block; }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-top: 12px; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: var(--primary); outline: none; background: #333; }
        .result { margin-top: 15px; padding: 12px; background: rgba(0,0,0,0.25); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
        .val { font-weight: bold; color: var(--primary); }
        .final { border-top: 1px solid #444; padding-top: 8px; margin-top: 8px; color: #fff; font-weight: bold; font-size: 1rem; }
        .hint { font-size: 0.7rem; color: var(--accent); margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>跟單投資複利試算</h2>
    
    <div class="card">
        <span class="card-title">第一階段：30次</span>
        <span class="fee-info">手續費率：18% (淨利 82%)</span>
        <label>初始本金</label>
        <input type="number" id="p1" value="500000" oninput="onInputP1()">
        <label>報酬率 (%)</label>
        <input type="number" id="r1" value="5" oninput="calculateAll()">
        <label>倉位 (%)</label>
        <input type="number" id="pos1" value="73" oninput="calculateAll()">
        <div class="result" id="res1"></div>
    </div>

    <div class="card step2">
        <span class="card-title">第二階段：40次</span>
        <span class="fee-info">手續費率：17% (淨利 83%)</span>
        <label>提領金額 (從上段結算扣除)</label>
        <input type="number" id="w2" value="0" oninput="onInputP1()">
        <label>投入本金 (可手動修改)</label>
        <input type="number" id="p2" oninput="onInputP2()">
        <div class="hint">※ 自動承接上段結算並百位取整</div>
        <label>報酬率 (%)</label>
        <input type="number" id="r2" value="5" oninput="calculateAll()">
        <label>倉位 (%)</label>
        <input type="number" id="pos2" value="73" oninput="calculateAll()">
        <div class="result" id="res2"></div>
    </div>

    <div class="card step3">
        <span class="card-title">第三階段：50次</span>
        <span class="fee-info">手續費率：16% (淨利 84%)</span>
        <label>提領金額 (從上段結算扣除)</label>
        <input type="number" id="w3" value="0" oninput="onInputP2()">
        <label>投入本金 (可手動修改)</label>
        <input type="number" id="p3" oninput="calculateAll()">
        <div class="hint">※ 自動承接上段結算並百位取整</div>
        <label>報酬率 (%)</label>
        <input type="number" id="r3" value="5" oninput="calculateAll()">
        <label>倉位 (%)</label>
        <input type="number" id="pos3" value="73" oninput="calculateAll()">
        <div class="result" id="res3"></div>
    </div>

    <p style="text-align: center; color: #666; font-size: 0.7rem;">
        所有階段本金計算皆會執行「無條件捨去至百位」。
    </p>
</div>

<script>
    const floor100 = n => Math.floor(Math.max(0, n) / 100) * 100;
    const fmt = n => "NT$ " + Math.round(n).toLocaleString();

    // 修改第一階段數據或提領2，同步 P2
    function onInputP1() {
        let p1 = floor100(document.getElementById('p1').value);
        let r1 = document.getElementById('r1').value / 100;
        let pos1 = document.getElementById('pos1').value / 100;
        let profit1 = (p1 * pos1 * r1 * 0.82) * 30;
        let end1 = p1 + profit1;
        let w2 = document.getElementById('w2').value || 0;
        
        document.getElementById('p2').value = floor100(end1 - w2);
        onInputP2(); // 連動到 P3
    }

    // 修改第二階段數據或提領3，同步 P3
    function onInputP2() {
        let p2 = floor100(document.getElementById('p2').value);
        let r2 = document.getElementById('r2').value / 100;
        let pos2 = document.getElementById('pos2').value / 100;
        let profit2 = (p2 * pos2 * r2 * 0.83) * 40;
        let end2 = p2 + profit2;
        let w3 = document.getElementById('w3').value || 0;
        
        document.getElementById('p3').value = floor100(end2 - w3);
        calculateAll();
    }

    function calculateAll() {
        const configs = [
            { id: 1, feeRate: 0.82, times: 30 },
            { id: 2, feeRate: 0.83, times: 40 },
            { id: 3, feeRate: 0.84, times: 50 }
        ];

        configs.forEach(conf => {
            let p = floor100(document.getElementById('p' + conf.id).value || 0);
            let r = (document.getElementById('r' + conf.id).value || 0) / 100;
            let pos = (document.getElementById('pos' + conf.id).value || 0) / 100;
            
            let singleNet = (p * pos * r) * conf.feeRate;
            let totalNetProfit = singleNet * conf.times;
            let finalBalance = p + totalNetProfit;

            document.getElementById('res' + conf.id).innerHTML = `
                <div class="row"><span>單次淨利:</span> <span class="val">${fmt(singleNet)}</span></div>
                <div class="row"><span>${conf.times}次總淨利:</span> <span class="val">${fmt(totalNetProfit)}</span></div>
                <div class="row final"><span>階段結算總值:</span> <span>${fmt(finalBalance)}</span></div>
            `;
        });
    }

    // 頁面加載時執行初始化
    onInputP1();
</script>

</body>
</html>
