<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複利跟單計算機 (百位取整版)</title>
    <style>
        :root { --primary: #00d2ff; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --accent: #f39c12; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 15px; }
        .container { width: 100%; max-width: 900px; margin: auto; }
        h2 { text-align: center; color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; border-top: 4px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card.highlight { border-top-color: var(--accent); }
        label { display: block; font-size: 0.8rem; color: #aaa; margin-top: 10px; }
        input { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        input[readonly] { color: var(--accent); font-weight: bold; }
        .result { margin-top: 15px; padding: 10px; background: #252525; border-radius: 5px; font-size: 0.9rem; }
        .row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .val { font-weight: bold; color: var(--primary); }
        .note { font-size: 0.75rem; color: #ef5350; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>跟單投資計算 (百位取整)</h2>
    <div class="grid">
        <div class="card">
            <strong>第一階段：30次 (18%)</strong>
            <label>初始本金 (需百位整數)</label>
            <input type="number" id="p1" value="500000" step="100" oninput="calc()">
            <label>報酬率 (%)</label>
            <input type="number" id="r1" value="5" oninput="calc()">
            <label>倉位 (%)</label>
            <input type="number" id="pos1" value="73" oninput="calc()">
            <div class="result">
                <div class="row"><span>階段總獲利:</span> <span class="val" id="profit1">0</span></div>
                <div class="row"><span>原始結算:</span> <span id="raw1">0</span></div>
            </div>
        </div>

        <div class="card highlight">
            <strong>第二階段：40次 (17%)</strong>
            <label>提領金額</label>
            <input type="number" id="w2" value="0" oninput="calc()">
            <label>下段投入本金 (百位取整)</label>
            <input type="number" id="p2" readonly>
            <div class="note">※ 自動捨去十位數以下的尾數</div>
            <label>報酬率 (%)</label>
            <input type="number" id="r2" value="5" oninput="calc()">
            <label>倉位 (%)</label>
            <input type="number" id="pos2" value="73" oninput="calc()">
            <div class="result">
                <div class="row"><span>階段總獲利:</span> <span class="val" id="profit2">0</span></div>
                <div class="row"><span>原始結算:</span> <span id="raw2">0</span></div>
            </div>
        </div>

        <div class="card">
            <strong>第三階段：50次 (16%)</strong>
            <label>提領金額</label>
            <input type="number" id="w3" value="0" oninput="calc()">
            <label>下段投入本金 (百位取整)</label>
            <input type="number" id="p3" readonly>
            <label>報酬率 (%)</label>
            <input type="number" id="r3" value="5" oninput="calc()">
            <label>倉位 (%)</label>
            <input type="number" id="pos3" value="73" oninput="calc()">
            <div class="result">
                <div class="row"><span>階段總獲利:</span> <span class="val" id="profit3">0</span></div>
                <div class="row"><span>最終總資產:</span> <span class="val" id="raw3" style="color:#fff">0</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    function floorTo100(num) {
        return Math.floor(num / 100) * 100;
    }

    function calc() {
        const fmt = n => "NT$ " + Math.round(n).toLocaleString();
        
        // Step 1
        let p1 = parseFloat(document.getElementById('p1').value) || 0;
        let r1 = (parseFloat(document.getElementById('r1').value) || 0) / 100;
        let pos1 = (parseFloat(document.getElementById('pos1').value) || 0) / 100;
        let profit1 = (p1 * pos1 * r1 * 0.82) * 30; // 18%手續費 = 82%淨利
        let total1 = p1 + profit1;
        document.getElementById('profit1').innerText = fmt(profit1);
        document.getElementById('raw1').innerText = fmt(total1);

        // Step 2
        let w2 = parseFloat(document.getElementById('w2').value) || 0;
        let p2 = floorTo100(total1 - w2); // 扣除提領並百位取整
        document.getElementById('p2').value = p2;
        let r2 = (parseFloat(document.getElementById('r2').value) || 0) / 100;
        let pos2 = (parseFloat(document.getElementById('pos2').value) || 0) / 100;
        let profit2 = (p2 * pos2 * r2 * 0.83) * 40; // 17%手續費
        let total2 = p2 + profit2;
        document.getElementById('profit2').innerText = fmt(profit2);
        document.getElementById('raw2').innerText = fmt(total2);

        // Step 3
        let w3 = parseFloat(document.getElementById('w3').value) || 0;
        let p3 = floorTo100(total2 - w3);
        document.getElementById('p3').value = p3;
        let r3 = (parseFloat(document.getElementById('r3').value) || 0) / 100;
        let pos3 = (parseFloat(document.getElementById('pos3').value) || 0) / 100;
        let profit3 = (p3 * pos3 * r3 * 0.84) * 50; // 16%手續費
        let total3 = p3 + profit3;
        document.getElementById('profit3').innerText = fmt(profit3);
        document.getElementById('raw3').innerText = fmt(total3);
    }
    calc();
</script>
</body>
</html>
